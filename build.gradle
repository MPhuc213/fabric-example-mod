plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name

}

repositories {
    // Các repository cần thiết để tải dependency
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "modid" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}


dependencies {
    minecraft "com.mojang:minecraft:1.20.4"
    // Cập nhật mappings: thay "build.28" bằng build number mới nhất nếu cần
    mappings "net.fabricmc:yarn:1.20.4+build.3:v2"
    
    // Phiên bản Fabric Loader tương thích cho Minecraft 1.20.4
    modImplementation "net.fabricmc:fabric-loader:0.16.10"
    
    // Phiên bản Fabric API tương thích cho Minecraft 1.20.4
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.97.2+1.20.4"
}


processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(17))
}

jar {
    inputs.property "archivesName", project.base.archivesName.get()


    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// Cấu hình maven publication (không cần khai báo lại dependencies ở đây)
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
        maven {
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        // Thêm repository khác nếu cần, ví dụ:
        // maven { url = 'https://maven.shedaniel.me/' }
    }
}
